
name: ShopLite CI - Build and Push Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-southeast-2
      ECR_REGISTRY: 106360388194.dkr.ecr.ap-southeast-2.amazonaws.com
      IMAGE_TAG: 1.0.0

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Frontend
        run: |
          docker build \
            -t $ECR_REGISTRY/shop-frontend:$IMAGE_TAG \
            -t $ECR_REGISTRY/shop-frontend:$GITHUB_SHA \
            ./frontend

          docker push $ECR_REGISTRY/shop-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/shop-frontend:$GITHUB_SHA

      - name: Build and Push Catalog
        run: |
          docker build \
            -t $ECR_REGISTRY/shop-catalog:$IMAGE_TAG \
            -t $ECR_REGISTRY/shop-catalog:$GITHUB_SHA \
            ./catalog-service

          docker push $ECR_REGISTRY/shop-catalog:$IMAGE_TAG
          docker push $ECR_REGISTRY/shop-catalog:$GITHUB_SHA

      - name: Build and Push Inventory
        run: |
          docker build \
            -t $ECR_REGISTRY/shop-inventory:$IMAGE_TAG \
            -t $ECR_REGISTRY/shop-inventory:$GITHUB_SHA \
            ./inventory-service

          docker push $ECR_REGISTRY/shop-inventory:$IMAGE_TAG
          docker push $ECR_REGISTRY/shop-inventory:$GITHUB_SHA

      - name: Build and Push Orders
        run: |
          docker build \
            -t $ECR_REGISTRY/shop-orders:$IMAGE_TAG \
            -t $ECR_REGISTRY/shop-orders:$GITHUB_SHA \
            ./order-service

          docker push $ECR_REGISTRY/shop-orders:$IMAGE_TAG
          docker push $ECR_REGISTRY/shop-orders:$GITHUB_SHA

      - name: Deploy to EC2 using Docker Compose
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/shoplite_key
          chmod 600 ~/.ssh/shoplite_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          # Copy Compose configuration to EC2
          scp -i ~/.ssh/shoplite_key \
            -o StrictHostKeyChecking=yes \
            docker-compose.yml \
            ubuntu@"$EC2_HOST":/opt/shoplite/docker-compose.yml

          # Deploy using Docker Compose on EC2
          ssh -i ~/.ssh/shoplite_key \
            -o StrictHostKeyChecking=yes \
            ubuntu@"$EC2_HOST" '
              set -e

              cd /opt/shoplite

              aws ecr get-login-password --region ap-southeast-2 |
                docker login --username AWS --password-stdin \
                106360388194.dkr.ecr.ap-southeast-2.amazonaws.com

              docker compose pull

              # Remove containers created by the old deployment script
              docker rm -f frontend catalog inventory orders postgres \
                2>/dev/null || true

              # Start services using Docker Compose
              docker compose up -d
            '
